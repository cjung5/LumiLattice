# Render Blueprint for the backend API (https://render.com/docs/blueprint-spec).
# The frontend runs on Vercel; see README "Deploy".
services:
  - type: web
    name: lumilattice-api
    runtime: docker
    plan: free
    dockerfilePath: ./backend/Dockerfile
    dockerContext: ./backend
    healthCheckPath: /api/health
    envVars:
      # Secrets: Render asks for these values when you create the Blueprint.
      - key: MODEL_API_KEY
        sync: false
      - key: MP_API_KEY
        sync: false
      - key: OPENALEX_API_KEY
        sync: false
      # Allows the Vercel production URL and its preview URLs.
      - key: CORS_ORIGIN_REGEX
        value: https://lumilattice[a-z0-9-]*\.vercel\.app
